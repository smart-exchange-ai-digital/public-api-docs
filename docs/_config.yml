# Site settings
title: "agenticX API Documentation"
description: "Comprehensive API documentation for agenticX Reporting Service - Supply and Demand Partner APIs"
baseurl: ""
url: "https://public-api-docs.theagenticx.ai"

# Site branding
logo: "/assets/icon.png"
brand_color: "#667eea"

# Build settings
markdown: kramdown
highlighter: rouge
# theme: minima  # Disabled to prevent default theme interference

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO settings
author: "agenticX"
twitter:
  username: theagenticx
social:
  name: agenticX
  links:
    - https://github.com/smart-exchange-ai-digital

# Kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
  auto_ids: true
  toc_levels: 1..6

# Exclude files
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor/

# Include files
include:
  - _pages
  - assets
  - "*.png"
  - "*.ico"

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
    values:
      layout: "page"